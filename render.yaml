services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"